# logrotate config for Sprogeny
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/sprogeny

/var/log/sprogeny/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 sprogeny adm
    sharedscripts
    postrotate
        # Signal PM2 to reopen log files after rotation
        su -s /bin/sh sprogeny -c 'pm2 reloadLogs' > /dev/null 2>&1 || true
    endscript
}
